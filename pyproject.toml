[project]
name = "maison-analytics-dbt"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ahsan Habib Sunny", email = "ahsanhabibsunny85@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-databricks>=1.13.0",
]

[project.scripts]
maison-analytics-dbt = "maison_analytics_dbt:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
]
